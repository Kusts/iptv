        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/webhooks/asaas/{tenantKey}:
    post:
      tags:
      - Webhooks
      operationId: ingestAsaasWebhook
      description: >-
        Public Asaas webhook ingress. No session auth and no
        X-Tenant-Context-Revision: Asaas sends the configured authToken as
        the `asaas-access-token` shared-secret header, which authenticates
        the provider, and the tenantKey path segment maps to the tenant via
        billing.tenant_channels (never from payload content). The presented
        value is validated channel-scoped against that channel's
        `webhook_secret_hash` only; there is no shared/global fallback. The legacy
        `X-Asaas-Secret` header remains accepted as a backward-compatible
        alias; when both are present, `asaas-access-token` takes precedence.
        When the resolved channel has no configured hash, the request fails
        with 503 before inbox/domain effects. Pipeline: verify, durable inbox
        insert-once on the provider event id,
        202 fast ack, then async normalize. `?defer=1` skips inline processing
        so a worker/test can drain the inbox.
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookTenantKey'
      - $ref: '#/components/parameters/AsaasWebhookAccessToken'
      - $ref: '#/components/parameters/AsaasWebhookSecret'
      - name: defer
        in: query
        required: false
        description: When '1', skips inline processing so a worker/test can drain the pending inbox.
        schema:
          type: string
          enum:
          - '1'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Payload accepted into the durable inbox (deduped when already seen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAcceptResponse'
        '401':
          description: Webhook authentication failed (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown webhook endpoint (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook secret not configured for this channel (UNAUTHORIZED) or database not configured (UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/webhooks/waha/{tenantKey}:
    post:
      tags:
      - Webhooks
      operationId: ingestWahaWebhook
      description: >-
        Public WAHA webhook ingress. No session auth and no
        X-Tenant-Context-Revision: the X-Waha-Secret shared-secret header
        authenticates the provider and the tenantKey path segment maps to the
