  /v1/human-reviews:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - HITL
      operationId: listHumanReviewQueue
      summary: List the tenant human-review queue
      description: >-
        Tenant-scoped queue read. `status` accepts any lifecycle state; the
        `PENDING` alias (and omission) selects the open queue
        (REQUESTED|QUEUED|ACKNOWLEDGED|IN_REVIEW). Requires the
        `agent.review.request` permission. Requires X-Tenant-Context-Revision
        at admission like every protected operation.
      parameters:
      - name: status
        in: query
        required: false
        description: Lifecycle state filter, or PENDING for the open queue (default).
        schema:
          type: string
          enum:
          - PENDING
          - REQUESTED
          - QUEUED
          - ACKNOWLEDGED
          - IN_REVIEW
          - GUIDANCE_PROVIDED
          - ACTION_TAKEN
          - RESOLVED
          - EXPIRED
          - CANCELLED
          default: PENDING
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Queue items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHumanReviewQueueResponse'
        '400':
          description: Unknown status filter (INVALID_STATUS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired session (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing agent.review.request permission or no active membership (FORBIDDEN / NO_ACTIVE_TENANT / TENANT_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
    post:
      tags:
      - HITL
      operationId: requestHumanReview
      summary: Request human review
      description: >-
        CommandBus `human_review.request` (permission `agent.review.request`).
        An Idempotency-Key header is forwarded when present but is not
        required. Requires X-Tenant-Context-Revision at admission like every
        protected operation.
      parameters:
      - $ref: '#/components/parameters/OptionalIdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHumanReviewRequest'
      responses:
        '201':
          description: Review requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReviewRequestIdResponse'
        '400':
          description: Command input failed validation (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired session (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing agent.review.request permission or no active membership (FORBIDDEN / NO_ACTIVE_TENANT / TENANT_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
