openapi: 3.1.0
info:
  title: AI Revenue & Operations Platform API
  version: 1.0.0
  description: Pre-implementation v1.0 scaffold. The implementation baseline under docs/15-implementation-baseline is authoritative; each Wave must reconcile/generate paths with canonical domain/status/policy contracts. Tenant context is resolved from authenticated identity/session and is never trusted from request bodies.
servers:
- url: https://api.example.com
  description: Production placeholder
security:
- bearerAuth: []
tags:
- name: Identity
- name: Trial
- name: Commerce
- name: Billing
- name: Subscription
- name: Provider Operations
- name: Support
- name: HITL
- name: Referral
- name: Communications
- name: Webhooks
- name: Knowledge
- name: Rewards
- name: Incidents
- name: Problems
paths:
  /v1/persons:
    post:
      tags:
      - Identity
      operationId: createPerson
      summary: Create or resolve a Person
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '200':
          description: Existing Person resolved idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/persons/{personId}:
    get:
      tags:
      - Identity
      operationId: getPerson
      parameters:
      - $ref: '#/components/parameters/PersonId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/trials/eligibility:
    post:
      tags:
      - Trial
      operationId: evaluateTrialEligibility
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialEligibilityRequest'
      responses:
        '200':
          description: Eligibility decision snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialEligibilityDecision'
  /v1/trials:
    post:
      tags:
      - Trial
      operationId: createTrial
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrialRequest'
      responses:
        '202':
          description: Trial accepted for provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trial'
        '409':
          description: Trial not allowed under canonical eligibility rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/trials/{trialId}:
    get:
      tags:
      - Trial
      operationId: getTrial
      parameters:
      - $ref: '#/components/parameters/TrialId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Trial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trial'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/offers/resolve:
    post:
      tags:
      - Commerce
      operationId: resolveOffer
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveOfferRequest'
      responses:
        '200':
          description: Policy-valid commercial offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
  /v1/orders:
    post:
      tags:
      - Commerce
      operationId: createOrder
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orders/{orderId}:
    get:
      tags:
      - Commerce
      operationId: getOrder
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{orderId}/charges:
    post:
      tags:
      - Billing
      operationId: createCharge
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/payments/{paymentId}/refund-requests:
    post:
      tags:
      - Billing
      operationId: requestRefund
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: Refund request created; execution still requires human review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequest'
  /v1/refund-requests/{refundRequestId}:
    get:
      tags:
      - Billing
      operationId: getRefundRequest
      parameters:
      - $ref: '#/components/parameters/RefundRequestId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Refund request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/refund-requests/{refundRequestId}/execute:
    post:
      tags:
      - Billing
      operationId: executeApprovedRefund
      description: Human-authorized execution path. The command revalidates approval, policy, refundable amount and current payment state.
      parameters:
      - $ref: '#/components/parameters/RefundRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Refund execution started or reconciliation required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/subscriptions/{subscriptionId}:
    get:
      tags:
      - Subscription
      operationId: getSubscription
      parameters:
      - $ref: '#/components/parameters/SubscriptionId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/subscriptions/{subscriptionId}/renewal-orders:
    post:
      tags:
      - Subscription
      - Commerce
      operationId: createRenewalOrder
      parameters:
      - $ref: '#/components/parameters/SubscriptionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRenewalOrderRequest'
      responses:
        '201':
          description: Renewal order created, including recurring add-ons active for the next cycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /v1/provider-operations:
    post:
      tags:
      - Provider Operations
      operationId: requestProviderOperation
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderOperationRequest'
      responses:
        '202':
          description: Provider operation queued or accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOperation'
  /v1/provider-operations/{providerOperationId}:
    get:
      tags:
      - Provider Operations
      operationId: getProviderOperation
      parameters:
      - $ref: '#/components/parameters/ProviderOperationId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Provider operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOperation'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/support/tickets:
    post:
      tags:
      - Support
      operationId: createSupportTicket
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportTicketRequest'
      responses:
        '201':
          description: Support ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
    get:
      tags:
      - Support
      operationId: listSupportTickets
      summary: List support tickets
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: List support tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSupportTicketsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/hitl/reviews/{reviewId}/guidance:
    post:
      tags:
      - HITL
      operationId: provideHumanGuidance
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanGuidanceRequest'
      responses:
        '200':
          description: Guidance registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReview'
  /v1/customers/{customerId}/referrals:
    post:
      tags:
      - Referral
      operationId: createReferral
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReferralRequest'
      responses:
        '201':
          description: Referral created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
  /v1/conversations/{conversationId}/messages:
    post:
      tags:
      - Communications
      operationId: sendConversationMessage
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Message accepted after communication policy checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/webhooks/asaas:
    post:
      tags:
      - Webhooks
      operationId: ingestAsaasWebhook
      description: Platform bearer auth is not used; provider-adapter authentication/signature/token validation is still mandatory
        before canonical processing.
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Payload persisted to external inbox for dedupe/processing
  /v1/webhooks/whatsapp:
    post:
      tags:
      - Webhooks
      operationId: ingestWhatsAppWebhook
      description: Platform bearer auth is not used; integration-specific webhook authentication/secret validation is mandatory
        when supported by the selected WhatsApp adapter.
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Payload persisted to external inbox for normalization
  /v1/support/tickets/{ticketId}:
    get:
      tags:
      - Support
      operationId: getSupportTicket
      summary: Get support ticket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Get support ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/support/tickets/{ticketId}/transition:
    post:
      tags:
      - Support
      operationId: transitionSupportTicket
      summary: Transition support ticket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionSupportTicketRequest'
      responses:
        '200':
          description: Transition support ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
  /v1/support/tickets/{ticketId}/solution-attempts:
    post:
      tags:
      - Support
      - Knowledge
      operationId: recordSolutionAttempt
      summary: Record support solution attempt
      parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSolutionAttemptRequest'
      responses:
        '201':
          description: Record support solution attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionAttempt'
  /v1/support/incidents:
    get:
      tags:
      - Incidents
      operationId: listIncidents
      summary: List incidents
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: List incidents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIncidentsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Incidents
      operationId: createIncident
      summary: Create incident
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Create incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
  /v1/support/incidents/{incidentId}:
    get:
      tags:
      - Incidents
      operationId: getIncident
      summary: Get incident
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Get incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/support/tickets/{ticketId}/incidents/{incidentId}:
    post:
      tags:
      - Support
      - Incidents
      operationId: linkTicketToIncident
      summary: Link ticket to incident
      parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/IncidentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Link ticket to incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
  /v1/support/problems:
    get:
      tags:
      - Problems
      operationId: listProblems
      summary: List problems
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: List problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProblemsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Problems
      operationId: createProblem
      summary: Create recurring problem
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProblemRequest'
      responses:
        '201':
          description: Create recurring problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/support/problems/{problemId}:
    get:
      tags:
      - Problems
      operationId: getProblem
      summary: Get problem
      parameters:
      - $ref: '#/components/parameters/ProblemId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Get problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/support/tickets/{ticketId}/problems/{problemId}:
    post:
      tags:
      - Support
      - Problems
      operationId: linkTicketToProblem
      summary: Link ticket to problem
      parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/ProblemId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Link ticket to problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
  /v1/hitl/reviews:
    get:
      tags:
      - HITL
      operationId: listHumanReviews
      summary: List human reviews
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: List human reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHumanReviewsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - HITL
      operationId: createHumanReview
      summary: Request human review
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHumanReviewRequest'
      responses:
        '201':
          description: Request human review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReview'
  /v1/hitl/reviews/{reviewId}:
    get:
      tags:
      - HITL
      operationId: getHumanReview
      summary: Get human review
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Get human review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReview'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/hitl/reviews/{reviewId}/actions:
