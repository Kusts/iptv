components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrialId:
      name: trialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefundRequestId:
      name: refundRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderOperationId:
      name: providerOperationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProblemId:
      name: problemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeItemId:
      name: knowledgeItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SolutionId:
      name: solutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReferralId:
      name: referralId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RewardId:
      name: rewardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Resource not found in authorized tenant scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Domain invariant or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type:
          - string
          - 'null'
          format: uuid
        details:
          type: object
          additionalProperties: true
    IdentityInput:
      type: object
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - WHATSAPP
          - PHONE
          - EMAIL
          - INSTAGRAM
          - TIKTOK
          - YOUTUBE
          - WEBSITE
        value:
          type: string
          minLength: 1
        verified:
          type: boolean
          default: false
    CreatePersonRequest:
      type: object
      required:
      - identity
      properties:
        displayName:
          type:
          - string
          - 'null'
        identity:
          $ref: '#/components/schemas/IdentityInput'
        source:
          type:
          - string
          - 'null'
    Person:
      type: object
      required:
      - id
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        displayName:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
    TrialEligibilityRequest:
      type: object
      required:
      - personId
      properties:
        personId:
          type: string
          format: uuid
        requestedDurationMinutes:
          type: integer
          enum:
          - 60
          - 180
          - 360
        adultContentEnabled:
          type: boolean
          default: false
        claimedExceptionReason:
          type:
          - string
          - 'null'
    TrialEligibilityDecision:
      type: object
      required:
      - id
      - personId
      - outcome
      - policyVersion
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - ALLOW
          - ALLOW_RETRIAL
          - REVIEW
          - DENY
        reasonCodes:
          type: array
          items:
            type: string
        policyVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateTrialRequest:
      type: object
      required:
      - personId
      - eligibilityDecisionId
      - durationMinutes
      properties:
        personId:
          type: string
          format: uuid
        eligibilityDecisionId:
          type: string
          format: uuid
        durationMinutes:
          type: integer
          enum:
          - 60
          - 180
          - 360
        adultContentEnabled:
          type: boolean
          default: false
        preferredDeviceProfileId:
          type:
          - string
          - 'null'
          format: uuid
    Trial:
      type: object
      required:
      - id
      - personId
      - kind
      - lifecycleStatus
      - technicalOutcome
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - TRIAL
          - RETRIAL
        lifecycleStatus:
          type: string
          enum:
          - REQUESTED
          - PROVISIONING
          - ACTIVE
          - ENDED
          - INVALIDATED
          - CANCELLED
        technicalOutcome:
          type: string
          enum:
          - PENDING
          - PASSED
          - FAILED
          - INCONCLUSIVE
        activatedAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    ResolveOfferRequest:
      type: object
      required:
      - personId
      properties:
        personId:
          type: string
          format: uuid
        planId:
          type:
          - string
          - 'null'
          format: uuid
        context:
          type: object
          additionalProperties: true
    Money:
      type: object
      required:
      - amountMinor
      - currency
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    OfferItem:
      type: object
      required:
      - sellableType
      - sellableId
      - quantity
      - unitPrice
      properties:
        sellableType:
          type: string
          enum:
          - PLAN
          - ADDON
          - APP_PRODUCT
        sellableId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
    Offer:
      type: object
      required:
      - id
      - status
      - items
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CREATED
          - PRESENTED
          - ACCEPTED
          - EXPIRED
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfferItem'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateOrderRequest:
      type: object
      required:
      - personId
      - items
      properties:
        personId:
          type: string
          format: uuid
        customerId:
          type:
          - string
          - 'null'
          format: uuid
        offerId:
          type:
          - string
          - 'null'
          format: uuid
        couponCode:
          type:
          - string
          - 'null'
        applyAvailableRewardCredits:
          type: boolean
          default: false
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - sellableType
            - sellableId
            - quantity
            properties:
              sellableType:
                type: string
                enum:
                - PLAN
                - ADDON
                - APP_PRODUCT
              sellableId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
    Order:
      type: object
      required:
      - id
      - personId
      - status
      - gross
      - discount
      - reward
      - net
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        customerId:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - AWAITING_PAYMENT
          - SETTLED
          - CANCELLED
          - EXPIRED
        gross:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        reward:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
        settledAt:
          type:
          - string
          - 'null'
          format: date-time
    CreateChargeRequest:
      type: object
      required:
      - provider
      - paymentMethod
      properties:
        provider:
          type: string
          enum:
          - ASAAS
        paymentMethod:
          type: string
          enum:
          - PIX
          - BOLETO
          - CARD
          - OTHER
        dueAt:
          type:
          - string
          - 'null'
          format: date-time
    Charge:
      type: object
      required:
      - id
      - orderId
      - status
      - amount
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - PAID
          - FAILED
          - CANCELLED
          - EXPIRED
        amount:
          $ref: '#/components/schemas/Money'
        providerPaymentUrl:
          type:
          - string
          - 'null'
          format: uri
        createdAt:
          type: string
          format: date-time
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
    Payment:
      type: object
      required:
      - id
      - orderId
      - chargeId
      - status
      - amount
      - confirmedAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        chargeId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CONFIRMED
          - PARTIALLY_REFUNDED
          - REFUNDED
          - CHARGEBACK
        amount:
          $ref: '#/components/schemas/Money'
        confirmedAt:
          type: string
          format: date-time
    CreateRefundRequest:
      type: object
      required:
      - amount
      - reason
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          minLength: 1
    RefundRequest:
      type: object
      required:
      - id
      - paymentId
      - status
      - amount
      - reason
      - requestedAt
      properties:
        id:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - REQUESTED
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
          - EXPIRED
          - CANCELLED
          - EXECUTED
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
        humanReviewRequestId:
          type:
          - string
          - 'null'
          format: uuid
        requestedAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
        executedAt:
          type:
          - string
          - 'null'
          format: date-time
    Refund:
      type: object
      required:
      - id
      - refundRequestId
      - paymentId
      - status
      - effectCertainty
      - amount
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        refundRequestId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PROCESSING
          - RECONCILING
          - SUCCEEDED
          - FAILED
          - CANCELLED
        effectCertainty:
          type: string
          enum:
          - KNOWN_APPLIED
          - KNOWN_NOT_APPLIED
          - UNKNOWN
        amount:
          $ref: '#/components/schemas/Money'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
    CreateRenewalOrderRequest:
      type: object
      properties:
        couponCode:
          type:
          - string
          - 'null'
        applyAvailableRewardCredits:
          type: boolean
          default: false
    SubscriptionAddon:
      type: object
      required:
      - id
      - addonId
      - quantity
      - billingType
      - status
      properties:
        id:
          type: string
          format: uuid
        addonId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        billingType:
          type: string
          const: RECURRING
        status:
          type: string
    Subscription:
      type: object
      required:
      - id
      - customerId
      - planId
      - status
      - currentPeriodStart
      - currentPeriodEnd
      - addons
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_ACTIVATION
          - ACTIVE
          - SUSPENDED
          - ENDED
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        addons:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionAddon'
    CreateProviderOperationRequest:
      type: object
      required:
      - providerAccountId
      - action
      - entityType
      - entityId
      properties:
        providerAccountId:
          type: string
          format: uuid
        action:
          type: string
          enum:
          - CREATE_TRIAL
          - CREATE_CUSTOMER
          - RENEW_CUSTOMER
          - TRUST_RENEWAL
          - BLOCK_CUSTOMER
          - UNBLOCK_CUSTOMER
          - SYNC_CUSTOMER
          - MIGRATE_SERVER
          - CHANGE_CONNECTIONS
          - GET_STATUS
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        input:
          type: object
          additionalProperties: true
    ProviderOperation:
      type: object
      required:
      - id
      - action
      - status
      - requestedAt
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        status:
          type: string
          enum:
          - REQUESTED
          - QUEUED
          - RUNNING
          - VERIFYING
          - RETRY_WAIT
          - HUMAN_REQUIRED
          - SUCCEEDED
          - FAILED
          - CANCELLED
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        errorCode:
          type:
          - string
          - 'null'
    CreateSupportTicketRequest:
      type: object
      required:
      - personId
      - summary
      properties:
        personId:
          type: string
          format: uuid
        customerId:
          type:
          - string
          - 'null'
          format: uuid
        conversationId:
          type:
          - string
          - 'null'
          format: uuid
        category:
          type:
          - string
          - 'null'
        summary:
          type: string
          minLength: 1
    SupportTicket:
      type: object
      required:
      - id
      - personId
      - status
      - summary
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - NEW
          - TRIAGING
          - IN_PROGRESS
          - WAITING_CUSTOMER
          - WAITING_INTERNAL
          - WAITING_PROVIDER
          - RESOLVED
          - CLOSED
          - CANCELLED
        priority:
          type:
          - string
          - 'null'
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        customerId:
          type:
          - string
          - 'null'
          format: uuid
        conversationId:
          type:
          - string
          - 'null'
          format: uuid
        category:
          type:
          - string
          - 'null'
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
    HumanGuidanceRequest:
      type: object
      required:
      - guidance
      properties:
        guidance:
          type: string
          minLength: 1
        approveProposedAction:
          type: boolean
          default: false
    HumanReview:
      type: object
      required:
      - id
      - status
      - reviewMode
      - reason
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - REQUESTED
          - QUEUED
          - ACKNOWLEDGED
          - IN_REVIEW
          - GUIDANCE_PROVIDED
          - ACTION_TAKEN
          - RESOLVED
          - EXPIRED
          - CANCELLED
        reviewMode:
          type: string
          enum:
          - APPROVAL
          - REVIEW
          - GUIDANCE
          - MANUAL_EXECUTION
        reason:
          type: string
          enum:
          - SECURITY_CHALLENGE
          - PROVIDER_EXCEPTION
          - RISK_REVIEW
          - FINANCIAL_REVIEW
          - CONTENT_COMPLIANCE
          - OTHER
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
        riskClass:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3
          - R4
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        resourceType:
          type:
          - string
          - 'null'
        resourceId:
          type:
          - string
          - 'null'
          format: uuid
        summary:
          type:
          - string
          - 'null'
    CreateReferralRequest:
      type: object
      required:
      - referredIdentity
      properties:
        referredIdentity:
          $ref: '#/components/schemas/IdentityInput'
        programId:
          type:
          - string
          - 'null'
          format: uuid
        sourceContext:
          type:
          - string
          - 'null'
    Referral:
      type: object
      required:
      - id
      - advocateCustomerId
      - code
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        advocateCustomerId:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
          enum:
          - CREATED
          - ATTRIBUTED
          - ENGAGED
          - QUALIFYING
          - CONFIRMED
          - REJECTED
          - EXPIRED
          - REVERSED
        createdAt:
