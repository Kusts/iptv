        '409':
          $ref: '#/components/responses/TenantContextConflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque session token
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    TenantContextRevision:
      name: X-Tenant-Context-Revision
      in: header
      required: true
      description: Canonical decimal-string revision returned by GET /v1/auth/session; an admission precondition only, never a tenant selector. Missing, malformed, or stale values fail with 409 TENANT_CONTEXT_CONFLICT before the protected operation runs.
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]*)$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Forwarded to the CommandBus when present; never required by the human-review endpoints.
      schema:
        type: string
        minLength: 8
        maxLength: 200
    WebhookTenantKey:
      name: tenantKey
      in: path
      required: true
      description: Provider-facing channel key mapped server-side to the tenant via the provider tenant_channels table; never taken from payload content.
      schema:
        type: string
        minLength: 1
    AsaasWebhookAccessToken:
      name: asaas-access-token
      in: header
      required: true
      description: Canonical shared-secret header authenticating the Asaas provider call (Asaas sends the configured authToken in this header), validated channel-scoped against that channel's `webhook_secret_hash` in billing.tenant_channels with no shared/global fallback; a missing or wrong value fails with 401 (or 503 when that channel has no secret configured), never 400. Takes precedence over X-Asaas-Secret when both are present.
      schema:
        type: string
    AsaasWebhookSecret:
      name: X-Asaas-Secret
      in: header
      required: false
      description: Legacy alias for the Asaas shared-secret header, kept for backward compatibility; prefer asaas-access-token. Only evaluated when asaas-access-token is absent; validated channel-scoped against that channel's `webhook_secret_hash` with no shared/global fallback. A missing or wrong value fails with 401 (or 503 when that channel has no secret configured), never 400.
      schema:
        type: string
    WahaWebhookSecret:
      name: X-Waha-Secret
      in: header
      required: false
      description: Shared-secret header authenticating the WAHA provider call, validated channel-scoped against that channel's `webhook_secret_hash` in communication.tenant_channels with no shared/global fallback; a missing or wrong value fails with 401 (or 503 when that channel has no secret configured), never 400.
      schema:
        type: string
