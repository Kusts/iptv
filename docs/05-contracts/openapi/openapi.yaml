openapi: 3.1.0
info:
  title: AI Revenue & Operations Platform API
  version: 1.0.0
  description: >-
    Pre-implementation v1.0 scaffold. The implementation baseline under
    docs/15-implementation-baseline is authoritative; each Wave must
    reconcile/generate paths with canonical domain/status/policy contracts.
    Tenant context is resolved from the authenticated server-side session and
    is never selected from request bodies or client headers. Every
    AuthGuard-protected operation requires the `X-Tenant-Context-Revision`
    header matching the session revision, except `GET /v1/auth/session` (the
    bootstrap endpoint that returns the current revision) and
    `POST /v1/auth/logout`. A missing, malformed, or stale revision returns
    `409 TENANT_CONTEXT_CONFLICT` before the protected operation runs.
    The check runs at request admission: a request admitted under a matching
    revision may still complete under the previous tenant snapshot after a
    concurrent switch. Switching increments the revision but does not cancel
    already admitted in-flight work and is not linearized through handler
    completion.
servers:
- url: https://api.example.com
  description: Production placeholder
security:
- bearerAuth: []
tags:
- name: Identity
- name: Trial
- name: Commerce
- name: Billing
- name: Subscription
- name: Finance
- name: Provider Operations
- name: Support
- name: HITL
- name: Referral
- name: Inventory
- name: Communications
- name: Webhooks
- name: Knowledge
- name: Rewards
- name: Incidents
- name: Problems
paths:
  /v1/auth/session:
    get:
      tags:
      - Identity
      operationId: getAuthSession
      summary: Read the current authenticated session snapshot
      description: Bootstrap endpoint; does not require X-Tenant-Context-Revision. Returns the authoritative tenant-context revision (decimal string) used as a precondition on subsequent protected requests.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authenticated session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Session is missing, invalid, or expired (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/register:
    post:
      tags:
      - Identity
      operationId: registerUser
      summary: Register a user and bootstrap the session
      description: >-
        Public bootstrap endpoint; does not use bearer auth and does not
        require X-Tenant-Context-Revision. Creates the user (and an owned
        tenant when tenantName is supplied), then returns the opaque session
        token plus the authoritative tenant-context revision (decimal string)
        used as a precondition on subsequent protected requests.
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: User registered; session bootstrapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing or non-string fields (INVALID_BODY), invalid email (INVALID_EMAIL), or blank tenant name (INVALID_TENANT_NAME)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already registered (EMAIL_TAKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database is not configured (UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/login:
    post:
      tags:
      - Identity
      operationId: loginUser
      summary: Authenticate with email and password
      description: >-
        Public bootstrap endpoint; does not use bearer auth and does not
        require X-Tenant-Context-Revision. Returns the opaque session token
        plus the authoritative tenant-context revision (decimal string) used
        as a precondition on subsequent protected requests.
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Authenticated session bootstrapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing email or password (INVALID_BODY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password (INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is not active (USER_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database is not configured (UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/logout:
    post:
      tags:
      - Identity
      operationId: logoutUser
      summary: Invalidate the current session token
      description: Bearer-protected but intentionally exempt from X-Tenant-Context-Revision; logout must succeed even on a stale revision.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Session invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Session is missing, invalid, or expired (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database is not configured (UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/persons:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Identity
      operationId: createPerson
      summary: Create or resolve a Person
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '200':
          description: Existing Person resolved idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/persons/{personId}:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Identity
      operationId: getPerson
      parameters:
      - $ref: '#/components/parameters/PersonId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/tenants:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Identity
      operationId: listTenants
      summary: List caller tenant memberships
      description: AuthGuard-only read of the server-side session snapshot; returns memberships plus the nullable active tenant id. Requires X-Tenant-Context-Revision at admission like every protected operation.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Caller memberships and active tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTenantsResponse'
        '401':
          description: Invalid or expired session (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
    post:
      tags:
      - Identity
      operationId: createTenant
      summary: Create a tenant and grant the caller tenant_owner membership
      description: >-
        Creates a tenant with the given name and optional slug (server-generated
        when omitted) and grants the caller an ACTIVE tenant_owner membership. A
        taken slug fails with `409 SLUG_TAKEN`; a missing, malformed, or stale
        revision fails with `409 TENANT_CONTEXT_CONFLICT` at admission. Both
        share the ErrorResponse shape.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantResponse'
        '400':
          description: Missing name or invalid slug (INVALID_BODY / INVALID_SLUG)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired session (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/tenants/{id}/switch:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Identity
      operationId: switchActiveTenant
      summary: Switch the session active tenant
      description: >-
        Sets the caller session active tenant to the path tenant and returns
        the updated tenant-context snapshot. The supplied revision is an
        optimistic concurrency precondition, not a tenant selector. The server
        atomically compares and increments it; a missing, malformed, or stale
        revision fails with `409 TENANT_CONTEXT_CONFLICT` without applying the
        switch. On 409, re-read the current session state and decide; do not
        blindly retry the same request. No request body. The response carries
        the incremented revision as a decimal string for subsequent protected
        requests. The switch applies to subsequently admitted requests only;
        already admitted in-flight operations are not cancelled and may
        complete under the previous tenant snapshot.
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Active tenant switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchActiveTenantResponse'
        '401':
          description: Invalid or expired session (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No active membership in this tenant (TENANT_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found (TENANT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/me:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Identity
      operationId: getMe
      summary: Read the tenant-scoped caller identity proof
      description: Proves the full server-side chain session to active tenant to membership to roles to permissions. Requires an active tenant with an ACTIVE membership; otherwise 403.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Caller identity with tenant roles and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Invalid or expired session (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No active tenant or membership (NO_ACTIVE_TENANT / TENANT_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/trials/eligibility:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Trial
      operationId: evaluateTrialEligibility
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialEligibilityRequest'
      responses:
        '200':
          description: Eligibility decision snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialEligibilityDecision'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/trials:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Trial
      operationId: createTrial
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrialRequest'
      responses:
        '202':
          description: Trial accepted for provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trial'
        '409':
          description: Trial not allowed under canonical eligibility rules, or tenant-context revision precondition failed (TENANT_CONTEXT_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/trials/{trialId}:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Trial
      operationId: getTrial
      parameters:
      - $ref: '#/components/parameters/TrialId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Trial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trial'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/offers/resolve:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Commerce
      operationId: resolveOffer
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveOfferRequest'
      responses:
        '200':
          description: Policy-valid commercial offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/orders:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Commerce
      operationId: createOrder
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Commerce
      operationId: getOrder
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/orders/{orderId}/charges:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Billing
      operationId: createCharge
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/payments/{paymentId}/refund-requests:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Billing
      operationId: requestRefund
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: Refund request created; execution still requires human review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequest'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/refund-requests/{refundRequestId}:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Billing
      operationId: getRefundRequest
      parameters:
      - $ref: '#/components/parameters/RefundRequestId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Refund request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/refund-requests/{refundRequestId}/execute:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Billing
      operationId: executeApprovedRefund
      description: Human-authorized execution path. The command revalidates approval, policy, refundable amount and current payment state.
      parameters:
      - $ref: '#/components/parameters/RefundRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Refund execution started or reconciliation required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/finance/contribution:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Finance
      operationId: getFinanceContribution
      description: FIN-04 contribution profit per customer (settled revenue minus COGS minus variable costs minus refunds/chargebacks). Read-only managerial view; analytics never drives sale/payment runtime (F14 degrades, never cascades).
      parameters:
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Contribution breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceContribution'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/finance/recompute:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Finance
      operationId: recomputeCostAllocations
      description: Idempotent cost-allocation ingest (replay-safe via migration-031 dedupe keys). Writes only finance.cost_allocations; ledger stays append-only.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecomputeAllocationsRequest'
      responses:
        '200':
          description: Recompute counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomputeAllocationsResponse'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/metrics/cac:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Finance
      operationId: getCustomerCac
      description: ACQ-04/REF-06 acquisition cost per customer (paid touches plus referral reward, kept separate). BASELINE_UNAVAILABLE when no attributed acquisition fact exists.
      parameters:
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Customer acquisition cost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCac'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/metrics/cohorts:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Finance
      operationId: listCohorts
      description: RET-04 monthly customer cohorts with accumulated settled revenue. Empty cohorts report quality flags, never invented values.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Monthly cohorts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortList'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/metrics/overview:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Finance
      operationId: getMetricsOverview
      description: FIN-01/FIN-04 executive summary (MRR, month revenue/cost, contribution margin). Degrades with quality flags, never fails sale/payment (F14).
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Executive metrics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsOverview'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/metrics:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Analytics
      operationId: listMetricDefinitions
      description: Wave 14 metric catalog (tenant-scoped materialization of the static registry; formulas owned by docs/08-data-analytics/metric-catalog.md). Read-only.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Metric catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricCatalog'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/metrics/{key}:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Analytics
      operationId: getMetricSeries
      description: Wave 14 daily series for one catalog key (replaceable read-model snapshots, idempotent replay). Unknown keys 404; static finance keys (cac/cohorts/overview) keep their own routes.
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        example: sales.settled_revenue_minor
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Daily metric series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/analytics/overview:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - Analytics
      operationId: getAnalyticsOverview
      description: Wave 14 dashboard summary (latest snapshot per catalog key with freshness/quality flags). Read-only; EMPTY before the first recompute.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
  /v1/analytics/recompute:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    post:
      tags:
      - Analytics
      operationId: recomputeAnalytics
      description: Wave 14 idempotent recompute (reads domain facts, writes only analytics.* snapshots; per-family F14 isolation with degradedFamilies + DEGRADED markers).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
