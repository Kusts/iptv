        request fails with 503 before inbox/domain effects.
        Pipeline: verify, durable inbox insert-once, 202 fast ack, then async
        normalize. `?defer=1` skips inline processing so a worker/test can
        drain the inbox.
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookTenantKey'
      - $ref: '#/components/parameters/WahaWebhookSecret'
      - name: defer
        in: query
        required: false
        description: When '1', skips inline processing so a worker/test can drain the pending inbox.
        schema:
          type: string
          enum:
          - '1'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Payload accepted into the durable inbox (deduped when already seen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAcceptResponse'
        '401':
          description: Webhook authentication failed (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown webhook endpoint (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook secret not configured for this channel (UNAUTHORIZED) or database not configured (UNAVAILABLE)
          content:
