      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanReviewActionRequest'
      responses:
        '200':
          description: Record review action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReview'
  /v1/conversations/{conversationId}:
    get:
      tags:
      - Communications
      operationId: getConversation
      summary: Get conversation
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Get conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/conversations/{conversationId}/control:
    post:
      tags:
      - Communications
      - HITL
      operationId: changeConversationControl
      summary: Change conversation control mode
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeConversationControlRequest'
      responses:
        '200':
          description: Change conversation control mode
          content:
            application/json:
              schema:
