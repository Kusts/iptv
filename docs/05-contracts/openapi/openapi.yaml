  /v1/human-reviews/center:
    parameters:
    - $ref: '#/components/parameters/TenantContextRevision'
    get:
      tags:
      - HITL
      operationId: getHumanReviewCenter
      summary: Aggregated HITL center of open work
      description: >-
        Tenant-scoped read-model aggregation of OPEN work across the four
        existing queues (human reviews, communications exceptions, billing
        exceptions, recovery tasks). Requires the `support.ticket.read`
        permission. Items are normalized to `{source, id, kind, summary,
        priority, ageMinutes, sla, deepLink, createdAt}` ordered by creation
        ascending; staleness follows the `hitl.sla` policy family (safe
        defaults warn 4h, breach 24h).
      parameters:
      - name: source
        in: query
        required: false
        description: Restrict the aggregation to one queue; omitted aggregates all four.
        schema:
          type: string
          enum:
          - human_review
          - comm_exception
          - billing_exception
          - recovery_task
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Aggregated center items plus the resolved SLA policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReviewCenterResponse'
        '400':
          description: Unknown center source (INVALID_SOURCE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired session (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing support.ticket.read permission or no active membership (FORBIDDEN / TENANT_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/TenantContextConflict'
