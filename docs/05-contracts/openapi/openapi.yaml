  responses:
    NotFound:
      description: Resource not found in authorized tenant scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Domain invariant, idempotency, or tenant-context conflict; protected operations also return this 409 shape as TENANT_CONTEXT_CONFLICT when the X-Tenant-Context-Revision admission precondition is missing, malformed, or stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TenantContextConflict:
      description: >-
        Tenant-context revision precondition failed
        (TENANT_CONTEXT_CONFLICT). Returned at request admission when
        X-Tenant-Context-Revision is missing, malformed, or stale relative to
        the session revision. Re-read GET /v1/auth/session and retry with the
        fresh revision; do not blindly retry. Admission is point-in-time only:
        an already admitted request may still complete under the previous
        tenant snapshot after a concurrent switch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AuthSessionResponse:
      type: object
      required:
      - user
      - activeTenantId
      - tenantContextRevision
      - memberships
      properties:
        user:
          type: object
          required:
          - id
          - email
          - displayName
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            displayName:
              type:
              - string
              - 'null'
        activeTenantId:
          type:
          - string
          - 'null'
          format: uuid
        tenantContextRevision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: Monotonic per-session revision; represented as a string to preserve PostgreSQL BIGINT precision.
        memberships:
          type: array
          items:
            type: object
            required:
            - tenantId
            - tenantSlug
            - tenantName
            - roleKey
            - status
            properties:
              tenantId:
