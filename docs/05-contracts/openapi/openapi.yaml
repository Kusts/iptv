  /v1/knowledge/candidates:
    post:
      tags:
      - Knowledge
      operationId: createKnowledgeCandidate
      summary: Create knowledge candidate
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeCandidateRequest'
      responses:
        '201':
          description: Create knowledge candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeItem'
  /v1/knowledge/items/{knowledgeItemId}:
    get:
      tags:
      - Knowledge
      operationId: getKnowledgeItem
      summary: Get knowledge item
      parameters:
      - $ref: '#/components/parameters/KnowledgeItemId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Get knowledge item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeItem'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/knowledge/items/{knowledgeItemId}/validation:
    post:
      tags:
      - Knowledge
      operationId: validateKnowledgeItem
      summary: Record knowledge validation decision
      parameters:
      - $ref: '#/components/parameters/KnowledgeItemId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateKnowledgeItemRequest'
      responses:
        '200':
          description: Record knowledge validation decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeItem'
  /v1/knowledge/solutions/{solutionId}/outcomes:
    post:
      tags:
      - Knowledge
      operationId: recordSolutionOutcome
      summary: Record solution outcome
      parameters:
      - $ref: '#/components/parameters/SolutionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSolutionOutcomeRequest'
      responses:
        '201':
          description: Record solution outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionOutcome'
  /v1/knowledge/search:
    post:
      tags:
      - Knowledge
      operationId: searchKnowledge
      summary: Search ranked knowledge
