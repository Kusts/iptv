info:
  title: AI Revenue & Operations Platform Domain Events
  version: 1.0.0
  description: Pre-implementation v1.0 event scaffold. The canonical event catalog under docs/15-implementation-baseline is authoritative. Events are persisted with an outbox before publication and critical consumers are idempotent.
