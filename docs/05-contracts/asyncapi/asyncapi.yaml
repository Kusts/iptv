components:
  schemas:
    Actor:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - system
          - agent
          - human
          - external
        id:
          type:
          - string
          - 'null'
    EventEnvelopeBase:
      type: object
      required:
      - event_id
      - event_type
      - occurred_at
      - recorded_at
      - tenant_id
      - aggregate_type
      - aggregate_id
      - aggregate_version
      - correlation_id
      - actor
      - schema_version
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        aggregate_type:
          type: string
        aggregate_id:
          type: string
          format: uuid
        aggregate_version:
          type: integer
          minimum: 1
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type:
          - string
          - 'null'
          format: uuid
        actor:
          $ref: '#/components/schemas/Actor'
        schema_version:
          type: integer
          const: 1
    PersonCreatedData:
      type: object
      required:
      - person_id
      properties:
        person_id:
          type: string
          format: uuid
    TrialRequestedData:
      type: object
      required:
      - trial_id
      - person_id
      - trial_kind
      - duration_minutes
      properties:
        trial_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        trial_kind:
          type: string
          enum:
          - TRIAL
          - RETRIAL
        duration_minutes:
          type: integer
          enum:
          - 60
          - 180
          - 360
    TrialActivatedData:
      type: object
      required:
      - trial_id
      - activated_at
      - expires_at
      properties:
        trial_id:
          type: string
          format: uuid
        activated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    TrialTechnicalPassedData:
      type: object
      required:
      - trial_id
      - assessed_at
      properties:
        trial_id:
          type: string
          format: uuid
        assessed_at:
          type: string
          format: date-time
        compatibility_context_id:
          type:
          - string
          - 'null'
          format: uuid
    OrderSettledData:
      type: object
      required:
      - order_id
      - net_amount_minor
      - currency
      - settlement_source
      properties:
        order_id:
          type: string
          format: uuid
        net_amount_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
        settlement_source:
          type: string
          enum:
          - PAYMENT
          - REWARD_CREDIT
          - MIXED
          - ZERO_VALUE
    PaymentConfirmedData:
      type: object
      required:
      - payment_id
      - order_id
      - amount_minor
      - currency
      - paid_at
      properties:
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
        paid_at:
          type: string
          format: date-time
    SubscriptionRenewedData:
      type: object
      required:
      - subscription_id
      - cycle_id
      - period_start
      - period_end
      properties:
        subscription_id:
          type: string
          format: uuid
        cycle_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
    SubscriptionAddonActivatedData:
      type: object
      required:
      - subscription_id
      - subscription_addon_id
      - addon_id
      - quantity
      - recurring
      properties:
        subscription_id:
          type: string
          format: uuid
        subscription_addon_id:
          type: string
          format: uuid
        addon_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        recurring:
          type: boolean
          const: true
    ProviderOperationRequestedData:
      type: object
      required:
      - provider_operation_id
      - provider_account_id
      - action
      - entity_type
      - entity_id
      properties:
        provider_operation_id:
          type: string
          format: uuid
        provider_account_id:
          type: string
          format: uuid
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
    ProviderOperationResultData:
      type: object
      required:
      - provider_operation_id
      - action
      properties:
        provider_operation_id:
          type: string
          format: uuid
        action:
          type: string
        error_code:
          type:
          - string
          - 'null'
    SupportTicketCreatedData:
      type: object
      required:
      - ticket_id
      - person_id
      properties:
        ticket_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
        category:
          type:
          - string
          - 'null'
    HitlReviewRequestedData:
      type: object
      required:
      - review_id
      - review_mode
      - reason
      - resource_type
      - resource_id
      - risk_class
      properties:
        review_id:
          type: string
          format: uuid
        review_mode:
          type: string
          enum:
          - APPROVAL
          - REVIEW
          - GUIDANCE
          - MANUAL_EXECUTION
        reason:
          type: string
          enum:
          - SECURITY_CHALLENGE
          - PROVIDER_EXCEPTION
          - RISK_REVIEW
          - FINANCIAL_REVIEW
          - CONTENT_COMPLIANCE
          - OTHER
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
        risk_class:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3
          - R4
    HitlReviewResolvedData:
      type: object
      required:
      - review_id
      - resolution
      properties:
        review_id:
          type: string
          format: uuid
        resolution:
          type: string
    ReferralConfirmedData:
      type: object
      required:
      - referral_id
      - advocate_customer_id
      - referred_person_id
      properties:
        referral_id:
          type: string
          format: uuid
        advocate_customer_id:
          type: string
          format: uuid
        referred_person_id:
          type: string
          format: uuid
        qualified_order_id:
          type:
          - string
          - 'null'
          format: uuid
    RewardIssuedData:
      type: object
      required:
      - reward_id
      - customer_id
      - reward_definition_id
      properties:
        reward_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        reward_definition_id:
          type: string
          format: uuid
        estimated_cost_minor:
          type:
          - integer
          - 'null'
          format: int64
        currency:
          type:
          - string
          - 'null'
    ProviderCreditConsumedData:
      type: object
      required:
      - entry_id
      - provider_account_id
      - quantity
      properties:
        entry_id:
          type: string
          format: uuid
        provider_account_id:
          type: string
          format: uuid
        quantity:
          type: number
          exclusiveMinimum: 0
        subscription_cycle_id:
          type:
          - string
          - 'null'
          format: uuid
        subscription_addon_id:
          type:
          - string
          - 'null'
          format: uuid
        cost_minor:
          type:
          - integer
          - 'null'
          format: int64
        currency:
          type:
          - string
          - 'null'
    RiskAssessmentCompletedData:
      type: object
      required:
      - assessment_id
      - subject_type
      - subject_id
      - outcome
      - policy_version
      properties:
        assessment_id:
          type: string
          format: uuid
        subject_type:
          type: string
        subject_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - ALLOW
          - REVIEW
          - DENY
        score:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        policy_version:
          type: string
    ConversationEventData:
      type: object
      required:
      - conversation_id
      properties:
        conversation_id:
          type: string
          format: uuid
        person_id:
          type:
          - string
          - 'null'
          format: uuid
        control_mode:
          type:
          - string
          - 'null'
          enum:
          - AI_CONTROL
          - HUMAN_CONTROL
          - PAUSED
          - null
        reason:
          type:
          - string
          - 'null'
    MessageEventData:
      type: object
      required:
      - message_id
      - conversation_id
      properties:
        message_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        direction:
          type:
          - string
          - 'null'
        channel:
          type:
          - string
          - 'null'
        delivery_status:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
    SupportTicketEventData:
      type: object
      required:
      - ticket_id
      properties:
        ticket_id:
          type: string
          format: uuid
        person_id:
          type:
          - string
          - 'null'
          format: uuid
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type:
