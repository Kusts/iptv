# P6 security gate (CODER-P6A) — estende as regras default com um allowlist
# global para constantes sintéticas de fixture / prosa de ADR já triadas
# como não-segredo (ver docs/16-pilot-closure/P6-SECURITY.md §2).
# Dentro do stanza, path E secret casam por AND: um segredo real novo —
# mesmo dentro desses arquivos — continua falhando o scan.
[extend]
useDefault = true

[allowlist]
description = "P6 triaged: synthetic test-fixture constants (hashed or request-scoped) + ADR prose false positive; exact values only, never real credentials. G01 triage 2026-10-11: cde8ae0 generic-api-key line 53 (chain fixture, sha256-hashed before persist, in-memory test traffic only) + #40 7bd0023 generic-api-key line 110 (shared BETTER_AUTH test constant); exact values + exact paths only (AND semantics), history still scanned via fetch-depth 0"
regexTarget = "secret"
regexes = [
  '''p13-fix1-asaas-secret''',
  '''w16-exposure-idem''',
  '''n3-arbitrary-resolve-key''',
  '''2FA/passkeys/organization''',
  '''g01-chain-secret''',
  '''integration-test-secret-0123456789''',
]
paths = [
  '''apps/api/test/billing-rls-rehearsal\.integration\.test\.ts''',
  '''apps/api/test/experiments-w16\.integration\.test\.ts''',
  '''apps/api/test/trial-dispatch\.unit\.test\.ts''',
  '''apps/api/test/g01-manual-reply-chain\.integration\.test\.ts''',
  '''apps/api/test/security-altpath-evals\.integration\.test\.ts''',
  '''docs/06-decisions/ADR-0015-auth-better-auth\.md''',
]
