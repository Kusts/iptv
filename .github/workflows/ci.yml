name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: iptv_test
          POSTGRES_USER: iptv
          POSTGRES_PASSWORD: iptv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iptv -d iptv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # Disposable CI database; integration suites apply migrations
          # themselves and skip when this is unset.
          TEST_DATABASE_URL: postgresql://iptv:iptv@localhost:5432/iptv_test
      - run: pnpm build
      - run: python scripts/validate_docs.py
      - run: python tests/contracts/test_contracts.py
      - run: python tests/contracts/test_seed_contract.py
