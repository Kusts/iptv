; Local-dev PgBouncer for RLS pooling certification (transaction mode).
; Profile "pooling" only; never on the default path. Owner traffic stays direct.
; Auth comes from userlist.txt (same directory, gitignored, LOCAL-DEV ONLY):
; see docs/10-operations/runbooks/rls-role-split-cutover.md for generation.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = *
listen_port = 6432
; PG17 stores SCRAM-SHA-256 secrets by default, so the pooler must speak
; SCRAM on both legs (client->pooler and pooler->server). userlist.txt holds
; LOCAL-DEV-ONLY *plaintext* test passwords (gitignored) because the pooler
; needs the cleartext to complete SCRAM toward the server — md5 verifiers
; fail against a SCRAM-only server ("wrong password type"). See runbook.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
max_client_conn = 100
default_pool_size = 20
reserve_pool_size = 5
server_idle_timeout = 30
stats_period = 60
